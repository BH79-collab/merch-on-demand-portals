// ── Fetch Shopify products ────────────────────────────────────────────────────
async function fetchProducts() {
  const res = await fetch(PROXY + "/shopify/products");
  if (!res.ok) throw new Error("Storefront API error " + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return (json.data.products.edges || []).map(({node:p}) => {
    const colours = {}, sizes = [];
    p.variants.edges.forEach(({node:v}) => {
      v.selectedOptions.forEach(o => {
        if (/colou?r/i.test(o.name)) colours[o.value] = 1;
        if (/size/i.test(o.name) && !sizes.includes(o.value)) sizes.push(o.value);
      });
    });
    (p.options || []).forEach(o => {
      if (/colou?r/i.test(o.name)) o.values.forEach(v => colours[v] = 1);
      if (/size/i.test(o.name)) o.values.forEach(v => { if (!sizes.includes(v)) sizes.push(v); });
    });
    return {
      id: p.id, name: p.title, category: p.productType || "",
      image: p.images.edges[0]?.node?.url || null,
      colours: Object.keys(colours), sizes,
    };
  });
}

// ── Atoms ─────────────────────────────────────────────────────────────────────
function Spinner() {
  return <span style={{display:"inline-block",width:16,height:16,border:"2px solid #2A2A2A",borderTopColor:T.accent,borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>;

function Label({children, required}) {
  return (
    <label style={{display:"block",fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>
      {children}{required && <span style={{color:T.accent,marginLeft:3}}>*</span>}

  );
}

function Input({label, required, value, onChange, placeholder, type="text", hint, mono}) {
  const [focused, setFocused] = useState(false);
  return (
    <div style={{marginBottom:16}}>
      {label && <Label required={required}>{label}</Label>}
      <input
        type={type} value={value||""} onChange={e=>onChange(e.target.value)}
        placeholder={placeholder}
        style={{width:"100%",padding:"11px 14px",background:T.input,border:`1.5px solid ${focused?T.accent:T.border}`,borderRadius:10,fontSize:mono?12:14,color:T.text,outline:"none",boxSizing:"border-box",fontFamily:mono?"monospace":"inherit",transition:"border-color 0.15s"}}

      />
      {hint && <p style={{color:T.muted,fontSize:11,marginTop:4}}>{hint}</p>}
    </div>
  );
}

function Select({label, required, value, onChange, options}) {

// ── DESIGN CANVAS ─────────────────────────────────────────────────────────────
function Canvas({side, logo, placement, onPlacement, product}) {
  const svgRef = useRef();
  const drag = useRef(null);
  const resize = useRef(null);

  const pz = {x:62, y:side==="front"?55:50, w:76, h:90};
  const pl = placement || {x:pz.x+pz.w*0.15, y:pz.y+pz.h*0.15, w:pz.w*0.7, h:pz.h*0.7};

  const getScale = () => {
    if (!svgRef.current) return {sx:1,sy:1};
    const r = svgRef.current.getBoundingClientRect();
    return {sx:r.width/200, sy:r.height/220};
  };

  const clientXY = e => e.touches ? [e.touches[0].clientX, e.touches[0].clientY] : [e.clientX, e.clientY];

  const startDrag = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx,sy} = getScale();
    const [cx,cy] = clientXY(e);
    drag.current = {mx:cx, my:cy, lx:pl.x*sx, ly:pl.y*sy};
    const move = ev => {
      if (!drag.current) return;
      const [ex,ey] = clientXY(ev);
      const {sx:sx2,sy:sy2} = getScale();
      let nx = (drag.current.lx + (ex-drag.current.mx)) / sx2;
      let ny = (drag.current.ly + (ey-drag.current.my)) / sy2;
      nx = Math.max(pz.x, Math.min(pz.x+pz.w-pl.w, nx));
      ny = Math.max(pz.y, Math.min(pz.y+pz.h-pl.h, ny));
      onPlacement({...pl, x:nx, y:ny});
    };
    const up = () => { drag.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  const startResize = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx} = getScale();
    const [cx] = clientXY(e);
    resize.current = {mx:cx, lw:pl.w*sx};
    const move = ev => {
      if (!resize.current) return;
      const [ex] = clientXY(ev);
      const {sx:sx2} = getScale();
      let nw = (resize.current.lw + (ex-resize.current.mx)) / sx2;
      nw = Math.max(10, Math.min(pz.x+pz.w-pl.x, nw));
      onPlacement({...pl, w:nw, h:nw*(pl.h/pl.w)});
    };
    const up = () => { resize.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  const isHood = product && (product.category||"").toLowerCase().includes("hood");
  const bodyPath = "M55,20 L30,45 L5,38 L18,80 L40,75 L40,205 L160,205 L160,75 L182,80 L195,38 L170,45 L145,20 C140,28 130,35 100,35 C70,35 60,28 55,20 Z";

  return (
    <div style={{flex:1}}>
      <p style={{textAlign:"center",fontSize:9,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{side.toUpperCase()}</p>
      {!logo && <p style={{textAlign:"center",fontSize:10,color:T.accent,marginBottom:3}}>Click garment to upload</p>}
      <svg ref={svgRef} viewBox="0 0 200 220" style={{width:"100%",display:"block",cursor:"pointer"}}
        onClick={()=>{ if(!logo) document.getElementById("upload-"+side).click(); }}>
        <ellipse cx="100" cy="215" rx="70" ry="6" fill="rgba(0,0,0,0.3)"/>
        <path d={bodyPath} fill="#333333" stroke="#444444" strokeWidth="1.5"/>
        <path d="M55,20 C60,28 70,35 100,35 C130,35 140,28 145,20" fill="none" stroke="#444444" strokeWidth="2"/>
        {isHood && <path d="M50,22 C45,10 65,2 100,2 C135,2 155,10 150,22 C145,15 130,8 100,8 C70,8 55,15 50,22 Z" fill="#333333" stroke="#444444" strokeWidth="1"/>}
        {isHood && side==="front" && <rect x="65" y="155" width="70" height="40" rx="4" fill="rgba(0,0,0,0.2)"/>}
        <rect x={pz.x} y={pz.y} width={pz.w} height={pz.h} fill="rgba(0,174,239,0.05)" stroke="rgba(0,174,239,0.4)" strokeWidth="1" strokeDasharray="5,3" rx="2"/>
        <text x={pz.x+pz.w/2} y={pz.y-3} textAnchor="middle" fontSize="7" fill="rgba(0,174,239,0.6)" fontFamily="Segoe UI,sans-serif">DTF ZONE</text>
        {logo ? (
          <>
            <image href={logo.url} x={pl.x} y={pl.y} width={pl.w} height={pl.h} preserveAspectRatio="xMidYMid meet" style={{cursor:"move"}} onMouseDown={startDrag} onTouchStart={startDrag}/>
            <rect x={pl.x} y={pl.y} width={pl.w} height={pl.h} fill="none" stroke={T.accent} strokeWidth="1.5" strokeDasharray="4,2" rx="2" style={{pointerEvents:"none"}}/>
            <rect x={pl.x+pl.w-9} y={pl.y+pl.h-9} width="11" height="11" fill={T.accent} rx="2" style={{cursor:"se-resize"}} onMouseDown={startResize} onTouchStart={startResize}/>
            <text x={pl.x+pl.w-3} y={pl.y+pl.h-1} fontSize="8" fill="#000" style={{pointerEvents:"none"}}>+</text>
          </>
        ) : (
          <text x={pz.x+pz.w/2} y={pz.y+pz.h/2+4} textAnchor="middle" fontSize="9" fill="rgba(0,174,239,0.35)" fontFamily="Segoe UI,sans-serif" fontWeight="600">Click to upload</text>
        )}
      </svg>
      <input id={"upload-"+side} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => document.getElementById("upload-"+side).dispatchEvent(new CustomEvent("logoloaded",{bubbles:true,detail:{url:ev.target.result,name:f.name,side}}));
        reader.readAsDataURL(f);
        e.target.value="";
      }}/>
      {logo && (
        <div style={{marginTop:4,padding:"4px 8px",background:T.greenDim,borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{color:T.green,fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{logo.name}</p>
          <button onClick={()=>onPlacement&&document.getElementById("upload-"+side).dispatchEvent(new CustomEvent("logocleared",{bubbles:true,detail:{side}}))}
            style={{background:"none",border:"none",color:T.muted,cursor:"pointer",fontSize:13,marginLeft:4}}>✕</button>
        </div>
      )}
    </div>
  );
}

// ── STEP: DESIGN ──────────────────────────────────────────────────────────────
function StepDesign({planId, slots, setSlots, products, loadingProducts}) {
  const plan = PLANS.find(p=>p.id===planId)||PLANS[0];
  const maxSlots = plan.max === 999 ? 10 : plan.max;
  const [numSlots, setNumSlots] = useState(Math.max(1, slots.filter(Boolean).length || 1));

  const updSlot = (i, patch) => {
    const s = [...slots];
    s[i] = {...(s[i]||{}), ...patch};
    setSlots(s);
  };

  // Handle logo uploads via custom events
  useEffect(() => {
    const handleLoaded = e => {
      const {url, name, side} = e.detail;
      // Find which slot this belongs to by checking canvas IDs
      // We use a simpler approach - store current slot index in a ref
    };
    document.addEventListener("logoloaded", handleLoaded);
    return () => document.removeEventListener("logoloaded", handleLoaded);
  }, []);

  return (
    <div className="fade">
      <StepHeader title="Product Design" sub={"Design up to " + (plan.max===999?"unlimited":plan.max) + " products on your " + plan.name + " plan."}/>
      {Array.from({length:numSlots}).map((_,i) => {
        const d = slots[i] || {};
        const prod = products.find(p=>p.id===d.productId);
        const isCap = prod && (prod.category||prod.name||"").toLowerCase().includes("cap");
        return (
          <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:16,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <p style={{fontWeight:700,color:T.text,fontSize:14}}>Product {i+1}{plan.max!==999?" of "+plan.max:""}</p>
              <div style={{display:"flex",gap:5}}>
                {Array.from({length:Math.min(numSlots,maxSlots)}).map((_,j)=>(
                  <div key={j} style={{width:7,height:7,borderRadius:"50%",background:j<i?T.green:j===i?T.accent:T.border}}/>
                ))}
              </div>
            </div>

            {/* Product selector */}
            {!d.productId ? (
              <div>
                <Label required>Choose a product</Label>
                {loadingProducts ? (
                  <div style={{textAlign:"center",padding:"20px 0"}}><Spinner/><p style={{color:T.muted,fontSize:12,marginTop:8}}>Loading products...</p></div>
                ) : (
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {products.map(p => (
                      <div key={p.id} onClick={()=>updSlot(i,{productId:p.id,colours:[],sizes:[],frontLogo:null,backLogo:null,frontPl:null,backPl:null})}
                        style={{border:`1.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",cursor:"pointer",background:T.input,transition:"border-color 0.15s"}}
                        onMouseEnter={e=>e.currentTarget.style.borderColor=T.accent}
                        onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}>
                        {p.image ? (
                          <img src={p.image} alt={p.name} style={{width:"100%",aspectRatio:"1",objectFit:"cover",display:"block"}}/>
                        ) : (
                          <div style={{width:"100%",aspectRatio:"1",background:"#1A1A1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>
                            {(p.category||"").toLowerCase().includes("cap")?"🧢":"👕"}
                          </div>
                        )}
                        <div style={{padding:"8px 10px"}}>
                          <p style={{color:T.text,fontWeight:600,fontSize:11,lineHeight:1.3}}>{p.name}</p>
                          <p style={{color:T.muted,fontSize:10,marginTop:2}}>{p.colours.length} colours</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <>
                {/* Selected product */}
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:T.greenDim,border:`1px solid ${T.green}`,borderRadius:8,marginBottom:14}}>
                  {prod?.image && <img src={prod.image} alt="" style={{width:36,height:36,borderRadius:6,objectFit:"cover"}}/>}
                  <div style={{flex:1}}>
                    <p style={{color:T.green,fontWeight:700,fontSize:12}}>{prod?.name}</p>
                    <p style={{color:T.muted,fontSize:10}}>DTF print</p>
                  </div>
                  <button onClick={()=>updSlot(i,{productId:"",frontLogo:null,backLogo:null})} style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"4px 8px",color:T.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Change</button>
                </div>

                {/* Canvases */}
                <div style={{display:"flex",gap:10,marginBottom:12}}
                  onLogoloaded={e=>{updSlot(i,{[e.detail.side+"Logo"]:{url:e.detail.url,name:e.detail.name},[e.detail.side+"Pl"]:null});}}
                  onLogocleared={e=>{updSlot(i,{[e.detail.side+"Logo"]:null,[e.detail.side+"Pl"]:null});}}>
                  <Canvas side="front" logo={d.frontLogo} placement={d.frontPl} product={prod}
                    onPlacement={p=>updSlot(i,{frontPl:p})}/>
                  {!isCap && <Canvas side="back" logo={d.backLogo} placement={d.backPl} product={prod}
                    onPlacement={p=>updSlot(i,{backPl:p})}/>}
                </div>
                <p style={{color:T.muted,fontSize:10,textAlign:"center",marginBottom:14}}>Click garment to upload logo. Drag to reposition. Drag corner to resize.</p>

                {/* Colours */}
                {prod?.colours?.length > 0 && (
                  <div style={{marginBottom:14}}>
                    <Label>{"Colours to offer" + (d.colours?.length>0?" ("+d.colours.length+" selected)":"")}</Label>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {prod.colours.map(col => {
                        const hex = COLOUR_HEX[col] || "#888888";
                        const sel = (d.colours||[]).includes(col);
                        const light = ["#FFFFFF","#E8DFD0","#C8C4BC","#E8D8C0"].includes(hex);
                        return (
                          <button key={col} title={col} onClick={()=>updSlot(i,{colours:sel?(d.colours||[]).filter(c=>c!==col):[...(d.colours||[]),col]})}
                            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",background:sel?"#1A1A1A":T.input,border:`1.5px solid ${sel?T.accent:T.border}`,borderRadius:99,cursor:"pointer",transition:"all 0.15s"}}>
                            <div style={{width:14,height:14,borderRadius:"50%",background:hex,border:light?"1px solid #444":"none",flexShrink:0}}/>
                            <span style={{fontSize:11,fontWeight:sel?700:400,color:sel?T.text:T.muted}}>{col}</span>
                          </button>
                        );
                      })}
                    </div>
                    <p style={{color:T.muted,fontSize:10,marginTop:5}}>One design applies to all selected colours.</p>
                  </div>
                )}

                {/* Sizes */}
                {prod?.sizes?.length > 0 && (
                  <div>
                    <Label>Sizes to offer</Label>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {prod.sizes.map(sz => {
                        const sel = (d.sizes||[]).includes(sz);
                        return (
                          <button key={sz} onClick={()=>updSlot(i,{sizes:sel?(d.sizes||[]).filter(s=>s!==sz):[...(d.sizes||[]),sz]})}
                            style={{padding:"6px 12px",background:sel?T.accent:"#1A1A1A",border:`1.5px solid ${sel?T.accent:T.border}`,borderRadius:8,fontSize:12,fontWeight:700,color:sel?"#000":T.muted,cursor:"pointer",fontFamily:"inherit"}}>
                            {sz}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        );
      })}

      {numSlots < maxSlots && (
        <button onClick={()=>setNumSlots(n=>n+1)}
          style={{width:"100%",padding:"11px",background:"transparent",border:`2px dashed ${T.border}`,borderRadius:12,color:T.muted,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}>
          + Add Another Product ({numSlots}/{maxSlots})
        </button>
      )}
    </div>
  );
}

    React.createElement("div", {style:{background:T.accentDim,border:"1px solid "+T.accent,borderRadius:12,padding:14,marginBottom:16,textAlign:"center"}},
      React.createElement("p", {style:{fontSize:20,marginBottom:6}}, "🔒"),
      React.createElement("p", {style:{color:T.accent,fontWeight:700,fontSize:13,marginBottom:4}}, "Secure Stripe Checkout"),
      React.createElement("p", {style:{color:T.muted,fontSize:12,lineHeight:1.6}}, "You will be taken to Stripe secure payment page. All major cards accepted. Cancel any time.")
    ),
    error && React.createElement("div", {style:{background:"#1A0505",border:"1px solid #EF4444",borderRadius:10,padding:12,marginBottom:14}},
      React.createElement("p", {style:{color:"#EF4444",fontSize:13}}, "⚠ "+error)
    ),
    React.createElement("button", {
      onClick:onCheckout, disabled:loading,
      style:{width:"100%",padding:14,background:loading?"#1A1A1A":T.accent,border:"none",borderRadius:12,fontSize:15,fontWeight:700,color:loading?T.muted:"#000",cursor:loading?"default":"pointer",fontFamily:"inherit"}
    }, loading ? "Creating checkout..." : "Continue to Secure Payment →"),
    React.createElement("p", {style:{color:T.muted,fontSize:11,textAlign:"center",marginTop:8}}, "You will return here automatically after payment.")
  );
}

// ── SUCCESS ───────────────────────────────────────────────────────────────────
function Success({brandName, planId}) {
  const plan = PLANS.find(p=>p.id===planId)||PLANS[0];
  return (
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{maxWidth:440,width:"100%",textAlign:"center"}}>
        <div style={{width:72,height:72,borderRadius:"50%",background:T.greenDim,border:`2px solid ${T.green}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",fontSize:30}}>✓</div>
        <h1 style={{fontSize:28,fontWeight:700,color:T.text,marginBottom:10}}>You are in!</h1>
        <p style={{color:T.muted,fontSize:14,lineHeight:1.7,marginBottom:28}}>
          Welcome, <strong style={{color:T.text}}>{brandName}</strong>. You are on the <strong style={{color:T.accent}}>{plan.name} Plan</strong>. Our team will review your application within 1-2 business days.
        </p>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:18,textAlign:"left",marginBottom:20}}>
          <p style={{fontWeight:700,color:T.text,marginBottom:12}}>What happens next</p>
          {[["1","Review","We review your brand and design preferences"],["2","Setup","Your collection goes live on our store"],["3","Sell","Customers order your products"],["4","Payout","$"+plan.payout+" per item, paid monthly"]].map(([n,t,d])=>(
            <div key={n} style={{display:"flex",gap:12,marginBottom:12}}>
              <div style={{width:26,height:26,borderRadius:"50%",background:T.accent,color:"#000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{n}</div>
              <div><p style={{fontWeight:700,color:T.text,fontSize:13}}>{t}</p><p style={{color:T.muted,fontSize:12}}>{d}</p></div>
            </div>
          ))}
        </div>
        <p style={{color:T.muted,fontSize:12}}>Questions? <span style={{color:T.accent}}>hello@merchantondemand.com.au</span></p>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [step, setStep]       = useState("brand");
  const [done, setDone]       = useState(false);
  const [busy, setBusy]       = useState(false);
  const [checkoutErr, setCheckoutErr] = useState("");
  const [products, setProducts]       = useState([]);
  const [loadingProds, setLoadingProds] = useState(true);

  const [brand,   setBrand]   = useState({brandName:"", category:""});
  const [contact, setContact] = useState({firstName:"", lastName:"", email:"", phone:"", password:"", confirmPassword:"", street:"", suburb:"", state:"", postcode:"", country:"Australia"});
  const [bank,    setBank]    = useState({bank:"", accountName:"", bsb:"", accountNumber:""});
  const [planId,  setPlanId]  = useState("starter");
  const [slots,   setSlots]   = useState([null]);

  // Load Shopify products
  useEffect(() => {
    fetchProducts()
      .then(p => { setProducts(p); setLoadingProds(false); })
      .catch(e => { console.warn("Products:", e.message); setLoadingProds(false); });
  }, []);

  // Handle Stripe Checkout return
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("checkout") === "success") {
      window.history.replaceState({}, "", window.location.pathname);
      const saved = localStorage.getItem("mod_vendor_meta");
      if (saved) {
        const meta = JSON.parse(saved);
        // Fallback save in case webhook missed it
        fetch(PROXY + "/vendor/save", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            meta,
            email: meta.email,
            authUserId: meta.authUserId,
            sessionId: params.get("session_id"),
            subscriptionId: null,
          }),
        }).then(r=>r.json()).then(d=>console.log("Vendor save fallback:", d)).catch(e=>console.warn("Fallback save:",e.message));
        localStorage.removeItem("mod_vendor_meta");
        setBrand({brandName: meta.vendorName, category: meta.category||""});
        setPlanId(meta.planId||"starter");
      }
      setDone(true);
    }
    if (params.get("checkout") === "cancel") {
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  const idx = STEPS.findIndex(s => s.id === step);
  const next = () => { if (idx < STEPS.length-1) setStep(STEPS[idx+1].id); };
  const back = () => { if (idx > 0) setStep(STEPS[idx-1].id); };

  const canContinue = () => {
    if (step==="brand")   return !!brand.brandName;
    if (step==="contact") return !!(contact.firstName && contact.lastName && contact.email && contact.phone && contact.password && contact.password.length>=8 && contact.password===contact.confirmPassword && contact.street && contact.suburb && contact.state && contact.postcode);
    if (step==="bank")    return !!(bank.bank && bank.accountName && bank.bsb && bank.accountNumber);
    if (step==="plan")    return !!planId;
    return true;
  };

  const handleCheckout = async () => {
    setBusy(true); setCheckoutErr("");
    try {
      // Create the vendor's login account first — Supabase verifies/hashes the
      // password server-side, so it never has to be checked or stored by us.
      const { data: signUpData, error: signUpErr } = await sb.auth.signUp({
        email: contact.email,
        password: contact.password,
      });
      if (signUpErr) {
        throw new Error(
          signUpErr.message.includes("already registered")
            ? "An account already exists for this email. Please log in instead."
            : signUpErr.message
        );
      }

      // Save all vendor data to localStorage so fallback can use it after redirect
      const meta = {
        vendorName:    brand.brandName,
        category:      brand.category,
        email:         contact.email,
        authUserId:    signUpData.user?.id || null,
        firstName:     contact.firstName,
        lastName:      contact.lastName,
        phone:         contact.phone,
        street:        contact.street,
        suburb:        contact.suburb,
        state:         contact.state,
        postcode:      contact.postcode,
        country:       contact.country || "Australia",
        bankName:      bank.bank,
        bsb:           bank.bsb,
        accountNumber: bank.accountNumber,
        accountName:   bank.accountName,
        planId:        planId,
        productSlots:  JSON.stringify(slots.filter(Boolean)),
      };
      localStorage.setItem("mod_vendor_meta", JSON.stringify(meta));

      const baseUrl = window.location.origin + window.location.pathname;
      const res = await fetch(PROXY + "/stripe/checkout", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          priceId:    PRICE_IDS[planId],
          successUrl: baseUrl + "?checkout=success&session_id={CHECKOUT_SESSION_ID}",
          cancelUrl:  baseUrl + "?checkout=cancel",
          email:      contact.email,
          name:       contact.firstName + " " + contact.lastName,
          metadata:   meta,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not create checkout session");
      window.location.href = data.url;
    } catch (e) {
      setCheckoutErr(e.message);
      setBusy(false);
    }
  };

  if (done) return <Success brandName={brand.brandName} planId={planId}/>;

  return (
    <div style={{background:T.bg, minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:T.card,borderBottom:`1px solid ${T.border}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <p style={{color:T.muted,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em"}}>Customer Application</p>
        <img src={window.MOD_LOGO} alt="MOD" style={{height:32,objectFit:"contain"}}/>
        <div style={{background:T.accentDim,border:`1px solid ${T.accent}`,borderRadius:99,padding:"3px 12px"}}>
          <span style={{color:T.accent,fontSize:11,fontWeight:700}}>Step {idx+1} of {STEPS.length}</span>
        </div>
      </div>

      {/* Progress */}
      <ProgressBar step={step}/>

      {/* Content */}
      <div style={{maxWidth:600,margin:"0 auto",padding:"24px 20px 80px"}}>
        {step==="brand"   && <StepBrand   d={brand}   set={setBrand}/>}
        {step==="contact" && <StepContact d={contact} set={setContact}/>}
        {step==="bank"    && <StepBank    d={bank}    set={setBank}/>}
        {step==="plan"    && <StepPlan    selected={planId} onSelect={setPlanId}/>}
        {step==="design"  && <StepDesign  planId={planId} slots={slots} setSlots={setSlots} products={products} loadingProducts={loadingProds}/>}
        {step==="payment" && <StepPayment planId={planId} onCheckout={handleCheckout} loading={busy} error={checkoutErr}/>}

        {/* Navigation */}
        <div style={{display:"flex",gap:10,marginTop:24}}>
          {idx > 0 && (
            <button onClick={back} style={{flex:1,padding:"12px",background:"transparent",border:`1.5px solid ${T.border}`,borderRadius:12,fontSize:14,fontWeight:700,color:T.muted,cursor:"pointer",fontFamily:"inherit"}}>
              Back
            </button>
          )}
          {step !== "payment" && (
            <button onClick={next} disabled={!canContinue()}
              style={{flex:2,padding:"12px",background:canContinue()?T.accent:"#1A1A1A",border:"none",borderRadius:12,fontSize:14,fontWeight:700,color:canContinue()?"#000":T.muted,cursor:canContinue()?"pointer":"default",fontFamily:"inherit"}}>
              Continue
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
