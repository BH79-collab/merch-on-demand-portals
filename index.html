async function fetchProducts() {
  const res = await fetch(PROXY + "/shopify/products");
  if (!res.ok) throw new Error("Storefront API error " + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return (json.data.products.edges || []).map(({node:p}) => {
    const colours = {}, sizes = [];
    const colourImages = {};
    p.variants.edges.forEach(({node:v}) => {
      const colourOpt = v.selectedOptions.find(o => /colou?r/i.test(o.name));
      v.selectedOptions.forEach(o => {
        if (/colou?r/i.test(o.name)) colours[o.value] = 1;
        if (/size/i.test(o.name) && !sizes.includes(o.value)) sizes.push(o.value);
      });
      if (colourOpt && v.image?.url && !colourImages[colourOpt.value]) {
        const front = v.image.url;
        // This store names colour photos "{n}_front.webp" / "{n}_back.webp" —
        // derive the back photo from the front when that pattern matches.
        const back = front.includes("_front.") ? front.replace("_front.", "_back.") : null;
        colourImages[colourOpt.value] = { front, back };
      }
    });
    (p.options || []).forEach(o => {
      if (/colou?r/i.test(o.name)) o.values.forEach(v => colours[v] = 1);
      if (/size/i.test(o.name)) o.values.forEach(v => { if (!sizes.includes(v)) sizes.push(v); });
    });
    const imgs = p.images.edges.map(e => e.node.url);
    return {
      id: p.id, name: p.title, category: p.productType || "",
      frontImage: imgs[0] || null,
      backImage:  imgs[1] || imgs[0] || null,
      colours: Object.keys(colours), sizes,
      colourImages,
    };
  });
}

// Composites a garment photo + a vendor's logo (at their saved placement)
// into a single mockup image, uploads it to Supabase Storage, and returns
// its public URL — this becomes the Shopify product's listing image.
// Routes both source images through the proxy's /image-proxy so the canvas
// never gets cross-origin "tainted" regardless of Shopify/Supabase's own
// CORS headers.
async function generateMockup(garmentUrl, logoUrl, placement) {
  const SCALE = 5; // 200x220 design-canvas viewBox -> 1000x1100px output
  const proxied = url => PROXY + "/image-proxy?url=" + encodeURIComponent(url);
  const loadImage = url => new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load image for mockup: " + url));
    img.src = proxied(url);
  });

  const [garment, logo] = await Promise.all([loadImage(garmentUrl), loadImage(logoUrl)]);

  const canvas = document.createElement("canvas");
  canvas.width = 200 * SCALE;
  canvas.height = 220 * SCALE;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(garment, 10*SCALE, 10*SCALE, 180*SCALE, 200*SCALE);
  const pl = placement || {x:70, y:60, w:60, h:60};
  ctx.drawImage(logo, pl.x*SCALE, pl.y*SCALE, pl.w*SCALE, pl.h*SCALE);

  const blob = await new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("Canvas export failed")), "image/png"));
  const path = `mockups/${crypto.randomUUID()}.png`;
  const { error } = await sb.storage.from("vendor-logos").upload(path, blob, {contentType:"image/png"});
  if (error) throw new Error("Mockup upload failed: " + error.message);
  const { data } = sb.storage.from("vendor-logos").getPublicUrl(path);
  return data.publicUrl;
}

function StripePaymentModal({vendor, planId, onSuccess, onClose}){
  const plan = planOf(planId);

  const [cardEl, setCardEl] = React.useState(null);
  const [processing, setProcessing] = React.useState(false);
  const [err, setErr] = React.useState("");

  React.useEffect(() => {
    const stripe = Stripe(STRIPE_PK);
    const elements = stripe.elements();
    const card = elements.create("card", {
      style: {
        base: { color: "#fff", fontFamily: "monospace", fontSize: "14px", "::placeholder": { color: "#71717a" } },
        invalid: { color: "#ef4444" },
      },
    });
    card.mount(cardRef.current);
    setCardEl(card);
    return () => card.destroy();
  }, []);

  const submit = async () => {
    setProcessing(true); setErr("");
    try {
      const result = await createStripeSubscription(vendor.email, vendor.name, planId, cardEl);
      // Save to Supabase
      await sb.from("subscriptions").upsert({
        vendor_id: vendor.id, plan: planId,
        price: plan.price, payout_rate: plan.payout,
        status: "active", stripe_subscription_id: result.subscriptionId,
      }, { onConflict: "vendor_id" });
      await sb.from("vendors").update({ plan: planId, payout_rate: plan.payout }).eq("id", vendor.id);
      onSuccess(planId);
      onClose();
    } catch(e) {
      setErr(e.message);
    } finally {
      setProcessing(false);
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>
      <div style={{background:"#18181b",border:`1px solid ${S.border}`,borderRadius:20,padding:26,maxWidth:420,width:"100%"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:18}}>
          <div>
            <p style={{fontSize:18,fontWeight:700,color:S.text}}>Subscribe to {plan.name}</p>
            <p style={{color:S.muted,fontSize:13,marginTop:2}}>${plan.price}/month · ${plan.payout} per item sold</p>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:S.muted}}>✕</button>
        </div>

        <div style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${S.border}`,borderRadius:10,padding:"14px 16px",marginBottom:16}}>
          <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>Card Details</p>
          <div ref={cardRef} style={{minHeight:20}} />

          {processing ? <Spin/> : `Pay $${plan.price}/month →`}

  );
}

// VENDOR PRODUCTS — logo placement canvas + editor
// ══════════════════════════════════════════════════════════════════════════════
function VendorCanvas({side, logo, placement, printZone, onPlacement, onLogo, product}) {
  const svgRef = React.useRef();
  const drag = React.useRef(null);
  const resize = React.useRef(null);
  const [uploading, setUploading] = useState(false);

  const pz = printZone || {x:40, y:30, w:120, h:150};
  const pl = placement || {x:pz.x+pz.w*0.2, y:pz.y+pz.h*0.15, w:pz.w*0.6, h:pz.h*0.6};

  const getScale = () => {
    if (!svgRef.current) return {sx:1,sy:1};
    const r = svgRef.current.getBoundingClientRect();
    return {sx:r.width/200, sy:r.height/220};
  };
  const clientXY = e => e.touches ? [e.touches[0].clientX, e.touches[0].clientY] : [e.clientX, e.clientY];

  const startDrag = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx,sy} = getScale();
    const [cx,cy] = clientXY(e);
    drag.current = {mx:cx, my:cy, lx:pl.x*sx, ly:pl.y*sy};
    const move = ev => {
      if (!drag.current) return;
      const [ex,ey] = clientXY(ev);
      const {sx:sx2,sy:sy2} = getScale();
      let nx = (drag.current.lx + (ex-drag.current.mx)) / sx2;
      let ny = (drag.current.ly + (ey-drag.current.my)) / sy2;
      nx = Math.max(pz.x, Math.min(pz.x+pz.w-pl.w, nx));
      ny = Math.max(pz.y, Math.min(pz.y+pz.h-pl.h, ny));
      onPlacement({...pl, x:nx, y:ny});
    };
    const up = () => { drag.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  const startResize = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx} = getScale();
    const [cx] = clientXY(e);
    resize.current = {mx:cx, lw:pl.w*sx};
    const move = ev => {
      if (!resize.current) return;
      const [ex] = clientXY(ev);
      const {sx:sx2} = getScale();
      let nw = (resize.current.lw + (ex-resize.current.mx)) / sx2;
      nw = Math.max(10, Math.min(pz.x+pz.w-pl.x, nw));
      onPlacement({...pl, w:nw, h:nw*(pl.h/pl.w)});
    };
    const up = () => { resize.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  const garmentImage = side === "front" ? product?.frontImage : product?.backImage;

  return (
    <div style={{flex:1,minWidth:130}}>
      <p style={{textAlign:"center",fontSize:9,fontWeight:700,color:S.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{side.toUpperCase()}</p>
      {!logo && <p style={{textAlign:"center",fontSize:10,color:S.accent,marginBottom:3}}>Click garment to upload</p>}
      <svg ref={svgRef} viewBox="0 0 200 220" style={{width:"100%",display:"block",cursor:"pointer",background:"#1A1A1A",borderRadius:8}}
        onClick={()=>{ if(!logo) document.getElementById("vp-upload-"+side+"-"+(product?.id||"")).click(); }}>
        {garmentImage ? (
          <image href={garmentImage} x="10" y="10" width="180" height="200" preserveAspectRatio="xMidYMid meet"/>
        ) : (
          <text x="100" y="110" textAnchor="middle" fontSize="10" fill={S.muted} fontFamily="Segoe UI,sans-serif">No product photo</text>
        )}
        <rect x={pz.x} y={pz.y} width={pz.w} height={pz.h} fill="rgba(139,92,246,0.05)" stroke="rgba(139,92,246,0.4)" strokeWidth="1" strokeDasharray="5,3" rx="2"/>
        {logo ? (
          <>
            <image href={logo.url} x={pl.x} y={pl.y} width={pl.w} height={pl.h} preserveAspectRatio="xMidYMid meet" style={{cursor:"move"}} onMouseDown={startDrag} onTouchStart={startDrag}/>
            <rect x={pl.x} y={pl.y} width={pl.w} height={pl.h} fill="none" stroke={S.accent} strokeWidth="1.5" strokeDasharray="4,2" rx="2" style={{pointerEvents:"none"}}/>
            <rect x={pl.x+pl.w-9} y={pl.y+pl.h-9} width="11" height="11" fill={S.accent} rx="2" style={{cursor:"se-resize"}} onMouseDown={startResize} onTouchStart={startResize}/>
          </>
        ) : (
          <text x={pz.x+pz.w/2} y={pz.y+pz.h/2+4} textAnchor="middle" fontSize="9" fill="rgba(139,92,246,0.5)" fontFamily="Segoe UI,sans-serif" fontWeight="600">Click to upload</text>
        )}
      </svg>
      <input id={"vp-upload-"+side+"-"+(product?.id||"")} type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{
        const f = e.target.files[0];
        if (!f) return;
        e.target.value="";
        if (f.size > MAX_LOGO_BYTES) { alert(`That file is ${(f.size/1024/1024).toFixed(1)}MB — logos must be under ${MAX_LOGO_BYTES/1024/1024}MB.`); return; }
        setUploading(true);
        const path = `${crypto.randomUUID()}-${f.name}`.replace(/[^A-Za-z0-9._-]/g, "_");
        const { error } = await sb.storage.from("vendor-logos").upload(path, f);
        setUploading(false);
        if (error) { alert("Logo upload failed: " + error.message); return; }
        const { data } = sb.storage.from("vendor-logos").getPublicUrl(path);
        onLogo && onLogo({url: data.publicUrl, name: f.name});
      }}/>
      {uploading && <p style={{textAlign:"center",fontSize:10,color:S.muted,marginTop:3}}>Uploading...</p>}
      {logo && (
        <div style={{marginTop:4,padding:"4px 8px",background:"rgba(16,185,129,0.1)",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{color:S.green,fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{logo.name||"logo"}</p>
          <button onClick={()=>onLogo && onLogo(null)} style={{background:"none",border:"none",color:S.muted,cursor:"pointer",fontSize:13,marginLeft:4}}>✕</button>
        </div>
      )}
    </div>
  );
}

function VendorProductsEditor({vendor}) {
  const [catalogue, setCatalogue] = useState([]);
  const [items, setItems] = useState([]);
  const [printZones, setPrintZones] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState({});
  const [toast, setToast] = useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 2500); };

  const load = useCallback(async () => {
    setLoading(true);
    const [prods, vpRes, zoneRes] = await Promise.all([
      fetchProducts().catch(()=>[]),
      sb.from("vendor_products").select("*").eq("vendor_id", vendor.id).order("created_at"),
      sb.from("print_zones").select("*"),
    ]);
    setCatalogue(prods);
    const zmap = {};
    (zoneRes.data || []).forEach(z => { zmap[`${z.product_id}:${z.side}`] = {x:z.x, y:z.y, w:z.w, h:z.h}; });
    setPrintZones(zmap);
    setItems((vpRes.data || []).map(row => ({
      localId: row.id, dbId: row.id, productId: row.product_id,
      colours: row.colours || [], sizes: row.sizes || [],
      frontLogo: row.front_logo_url ? {url: row.front_logo_url} : null,
      backLogo:  row.back_logo_url  ? {url: row.back_logo_url}  : null,
      frontPl: row.front_placement, backPl: row.back_placement,
    })));
    setLoading(false);
  }, [vendor.id]);

  useEffect(() => { load(); }, [load]);

  const plan = planOf(vendor.plan);
  const maxSlots = plan.max || 3;

  const updateItem = (localId, patch) => setItems(its => its.map(it => it.localId===localId ? {...it, ...patch} : it));

  const addItem = () => {
    if (items.length >= maxSlots) return;
    setItems(its => [...its, {localId:"new-"+Date.now(), dbId:null, productId:"", colours:[], sizes:[], frontLogo:null, backLogo:null, frontPl:null, backPl:null}]);
  };

  const removeItem = async item => {
    if (item.dbId) await sb.from("vendor_products").delete().eq("id", item.dbId);
    setItems(its => its.filter(it => it.localId !== item.localId));
    showToast("Product removed");
  };

  const saveItem = async item => {
    if (!item.productId) return;
    if (!item.colours.length) { showToast("Pick at least one colour before saving"); return; }
    if (!item.sizes.length)   { showToast("Pick at least one size before saving"); return; }
    setSaving(s => ({...s, [item.localId]: true}));
    const { data, error } = await sb.from("vendor_products").upsert({
      vendor_id: vendor.id, product_id: item.productId,
      colours: item.colours, sizes: item.sizes,
      front_logo_url: item.frontLogo?.url || null, back_logo_url: item.backLogo?.url || null,
      front_placement: item.frontPl, back_placement: item.backPl,
    }, {onConflict:"vendor_id,product_id"}).select().single();
    setSaving(s => ({...s, [item.localId]: false}));
    if (error) { showToast("Save failed: " + error.message); return; }
    updateItem(item.localId, {dbId: data.id});
    showToast("Product saved");
  };

  if (loading) return <div style={{display:"flex",justifyContent:"center",padding:60}}><Spin/></div>;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {toast && <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:S.green,color:"#000",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:300}}>{toast}</div>}
      <div>
        <p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>My Products</p>
        <p style={{color:S.muted,fontSize:12,marginTop:2}}>{items.length} of {maxSlots===999?"unlimited":maxSlots} products used</p>
      </div>

      {items.map(item => {
        const prod = catalogue.find(p => p.id === item.productId);
        const isCap = prod && (prod.category||prod.name||"").toLowerCase().includes("cap");
        return (
          <Card key={item.localId}>
            {!item.productId ? (
              <div>
                <p style={{color:S.text,fontWeight:700,marginBottom:10,fontSize:13}}>Choose a product</p>
                {catalogue.length===0 ? <p style={{color:S.muted,fontSize:12}}>No products available.</p> : (
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,maxHeight:280,overflowY:"auto"}}>
                    {catalogue.map(p => (
                      <div key={p.id} onClick={()=>updateItem(item.localId,{productId:p.id, colours:[], sizes:[], frontLogo:null, backLogo:null, frontPl:null, backPl:null})}
                        style={{cursor:"pointer",border:`1px solid ${S.border}`,borderRadius:10,padding:8,textAlign:"center"}}>
                        {p.frontImage ? <img src={p.frontImage} style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:6,marginBottom:6,background:"#000"}}/> : <div style={{width:"100%",aspectRatio:"1",background:S.faint,borderRadius:6,marginBottom:6}}/>}
                        <p style={{color:S.text,fontSize:11,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</p>
                      </div>
                    ))}
                  </div>
                )}
                {items.length>1 && <div style={{marginTop:10}}><Btn outline color={S.muted} small onClick={()=>removeItem(item)}>Cancel</Btn></div>}
              </div>
            ) : (
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <p style={{color:S.text,fontWeight:700,fontSize:13}}>{prod?.name || "Unknown product"}</p>
                  <button onClick={()=>updateItem(item.localId,{productId:""})} style={{background:"none",border:`1px solid ${S.border}`,borderRadius:6,padding:"4px 8px",color:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Change</button>
                </div>

                <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:12}}>
                  <VendorCanvas side="front" logo={item.frontLogo} placement={item.frontPl} product={prod}
                    printZone={printZones[`${item.productId}:front`]}
                    onPlacement={pl=>updateItem(item.localId,{frontPl:pl})}
                    onLogo={l=>updateItem(item.localId,{frontLogo:l})}/>
                  {!isCap && <VendorCanvas side="back" logo={item.backLogo} placement={item.backPl} product={prod}
                    printZone={printZones[`${item.productId}:back`]}
                    onPlacement={pl=>updateItem(item.localId,{backPl:pl})}
                    onLogo={l=>updateItem(item.localId,{backLogo:l})}/>}
                </div>

                {prod && prod.colours.length>0 && (
                  <div style={{marginBottom:10}}>
                    <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",marginBottom:6}}>Colours</p>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {prod.colours.map(c => (
                        <button key={c} onClick={()=>updateItem(item.localId,{colours: item.colours.includes(c) ? item.colours.filter(x=>x!==c) : [...item.colours,c]})}
                          style={{padding:"5px 10px",borderRadius:20,border:`1.5px solid ${item.colours.includes(c)?S.accent:S.border}`,background:item.colours.includes(c)?S.accent+"22":"transparent",color:item.colours.includes(c)?S.accent:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{c}</button>
                      ))}
                    </div>
                  </div>
                )}
                {prod && prod.sizes.length>0 && (
                  <div style={{marginBottom:12}}>
                    <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",marginBottom:6}}>Sizes</p>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {prod.sizes.map(sz => (
                        <button key={sz} onClick={()=>updateItem(item.localId,{sizes: item.sizes.includes(sz) ? item.sizes.filter(x=>x!==sz) : [...item.sizes,sz]})}
                          style={{padding:"5px 10px",borderRadius:20,border:`1.5px solid ${item.sizes.includes(sz)?S.accent:S.border}`,background:item.sizes.includes(sz)?S.accent+"22":"transparent",color:item.sizes.includes(sz)?S.accent:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{sz}</button>
                      ))}
                    </div>
                  </div>
                )}

                <div style={{display:"flex",gap:8}}>
                  <Btn onClick={()=>saveItem(item)} disabled={!!saving[item.localId]||!item.colours.length||!item.sizes.length} color={S.green}>{saving[item.localId]?<Spin/>:"Save"}</Btn>
                  <Btn onClick={()=>removeItem(item)} outline color={S.red}>Remove</Btn>
                </div>
              </div>
            )}
          </Card>
        );
      })}

      {items.length < maxSlots && (
        <button onClick={addItem} style={{padding:14,border:`1.5px dashed ${S.border}`,borderRadius:12,background:"transparent",color:S.muted,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          + Add Another Product ({items.length}/{maxSlots===999?"∞":maxSlots})
        </button>
      )}
    </div>
  );
}

// VENDOR PORTAL
// ══════════════════════════════════════════════════════════════════════════════
function VendorPortal({session,onLogout}){
  const[view,setView]=useState("dashboard");
  const[vendor,setVendor]=useState(null);
  const[orders,setOrders]=useState([]);
  const[payments,setPayments]=useState([]);
  const[planModal,setPlanModal]=useState(false);
  const[stripeModal,setStripeModal]=useState(null);
  const[loading,setLoading]=useState(true);
  const[toast,setToast]=useState(null);
  const[editing,setEditing]=useState(false);
  const[editForm,setEditForm]=useState({});
  const[saving,setSaving]=useState(false);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  useEffect(()=>{
    const load=async()=>{
      setLoading(true);
      const{data:v}=await sb.from("vendors").select("*").eq("auth_user_id",session.user.id).single();
      if(v){
        setVendor(v);
        const{data:o}=await sb.from("orders").select("*").eq("vendor_id",v.id).order("order_date",{ascending:false});
        const{data:p}=await sb.from("payments").select("*").eq("vendor_id",v.id).order("created_at",{ascending:false});
        setOrders(o||[]);
        setPayments(p||[]);
      }
      setLoading(false);
    };
    load();
  },[session]);

  const savePlan=async(planId)=>{
    // Open Stripe payment modal for the new plan
    setStripeModal(planId);
    setPlanModal(false);
  };

  const onSubscribeSuccess=async(planId)=>{
    const p=planOf(planId);
    setVendor(v=>({...v,plan:planId,payout_rate:p.payout}));
    showToast(`Plan updated to ${p.name} — subscription active!`);
  };

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:S.bg}}><Spin/></div>;
  if(!vendor)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:S.bg,flexDirection:"column",gap:12}}><p style={{color:S.red}}>No vendor account found for {session.user.email}</p><Btn onClick={onLogout}>Back to Login</Btn></div>;

  const p=planOf(vendor.plan);
  const now=new Date();
  const period=now.toLocaleString("en-AU",{month:"long",year:"numeric"});
  const monthOrders=orders.filter(o=>o.period===period);
  const monthItems=monthOrders.reduce((s,o)=>s+(o.quantity||0),0);
  const monthPayout=monthItems*(vendor.payout_rate||10);
  const monthRev=monthOrders.reduce((s,o)=>s+(o.revenue||0),0);

  const saveProfile=async()=>{
    setSaving(true);
    try{
      await sb.from("vendors").update({
        phone:editForm.phone||vendor.phone,
        address:[editForm.street,editForm.suburb,editForm.state,editForm.postcode,"Australia"].filter(Boolean).join(", "),
        bank:editForm.bank||vendor.bank,
        bsb:editForm.bsb||vendor.bsb,
        account_number:editForm.accountNumber||vendor.account_number,
        account_name:editForm.accountName||vendor.account_name,
      }).eq("id",vendor.id);
      setVendor(v=>({...v,
        phone:editForm.phone||v.phone,
        bank:editForm.bank||v.bank,
        bsb:editForm.bsb||v.bsb,
        account_number:editForm.accountNumber||v.account_number,
        account_name:editForm.accountName||v.account_name,
      }));
      setEditing(false);
      showToast("Profile updated");
    }catch(e){showToast("Error saving: "+e.message,"error");}
    finally{setSaving(false);}
  };

  const NAV=[["dashboard","Overview","◈"],["products","My Products","▦"],["sales","Sales","◆"],["payouts","Payouts","⬡"],["myplan","My Plan","★"],["settings","Settings","◎"]];

  return(
    <div style={{background:S.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:toast.type==="success"?S.green:S.red,color:"#000",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:300}}>{toast.msg}</div>}

      <div style={{background:"rgba(10,10,15,0.97)",borderBottom:`1px solid ${S.border}`,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:"50%",background:p.col,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,color:"#000"}}>{vendor.brand_name?.[0]||"V"}</div>
          <div><p style={{fontWeight:700,fontSize:13,color:S.text}}>{vendor.brand_name||vendor.store_name}</p><p style={{color:S.muted,fontSize:9}}>Vendor Portal</p></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <Tag color={p.col}>{p.name}</Tag>
          <button onClick={onLogout} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${S.border}`,borderRadius:8,padding:"5px 10px",color:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Sign out</button>
        </div>
      </div>

      <div style={{background:"rgba(10,10,15,0.97)",borderBottom:`1px solid ${S.border}`,display:"flex",overflowX:"auto",padding:"0 14px"}}>
        {NAV.map(([id,label,icon])=><button key={id} onClick={()=>setView(id)} style={{padding:"11px 12px",background:"none",border:"none",borderBottom:`2px solid ${view===id?S.accent:"transparent"}`,color:view===id?S.accent:S.muted,fontWeight:view===id?700:500,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{icon} {label}</button>)}
      </div>

      <div style={{padding:"20px 18px 100px"}}>

        {view==="dashboard"&&(
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            <div><p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>Welcome back, {vendor.name?.split(" ")[0]} 👋</p><p style={{color:S.muted,fontSize:12,marginTop:2}}>{period}</p></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Stat label="Items Sold" value={monthItems} sub="This month"/>
              <Stat label="Your Payout" value={fmt(monthPayout)} sub={`$${vendor.payout_rate||10} × ${monthItems}`} color={S.green}/>
              <Stat label="Store Revenue" value={fmt(monthRev)} sub="Gross sales"/>
              <Stat label="Payout Rate" value={`$${vendor.payout_rate||10}`} sub={`${p.name} plan`} color={p.col}/>
            </div>
            <div style={{background:S.faint,borderRadius:16,padding:20}}>
              <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Next Scheduled Payout</p>
              <p style={{color:S.green,fontWeight:900,fontSize:28,fontFamily:"monospace"}}>{fmt(monthPayout)}</p>
              <p style={{color:S.muted,fontSize:12,marginTop:4}}>End of {period} · {vendor.bank} ••••{vendor.account_number?.slice(-4)}</p>
            </div>
            <div>
              <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>Recent Orders</p>
              {monthOrders.slice(0,5).map(o=>(
                <div key={o.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${S.border}`}}>
                  <div><p style={{color:S.text,fontSize:13}}>{o.product_title}</p><p style={{color:S.muted,fontSize:11}}>{fmtD(o.order_date)} · qty {o.quantity}</p></div>
                  <p style={{color:S.green,fontWeight:700}}>{fmt(o.quantity*(vendor.payout_rate||10))}</p>
                </div>
              ))}
              {monthOrders.length===0&&<p style={{color:S.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>No orders yet this period</p>}
            </div>
          </div>
        )}

        {view==="products"&&<VendorProductsEditor vendor={vendor}/>}

        {view==="sales"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>My Sales</p>
            {orders.length===0?<p style={{color:S.muted,textAlign:"center",padding:"40px 0"}}>No orders yet</p>
            :orders.map(o=>(
              <Card key={o.id} style={{padding:14}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <div><p style={{color:S.text,fontWeight:600,fontSize:13}}>{o.product_title}</p><p style={{color:S.muted,fontSize:11}}>{fmtD(o.order_date)} · qty {o.quantity}</p></div>
                  <div style={{textAlign:"right"}}><p style={{color:S.green,fontWeight:700}}>{fmt(o.quantity*(vendor.payout_rate||10))}</p><p style={{color:S.muted,fontSize:10}}>payout</p></div>
                </div>
                <div style={{display:"flex",gap:14,fontSize:11,color:S.muted}}>
                  <span>Revenue: <b style={{color:S.text}}>{fmt(o.revenue)}</b></span>
                  <span>Period: <b style={{color:S.text}}>{o.period}</b></span>

          </div>

            <p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>Payout History</p>

              <p style={{fontWeight:700,color:S.text,marginBottom:10}}>Bank on File</p>
              <RowItem label="Bank" value={vendor.bank||"—"}/>
              <RowItem label="BSB" value={vendor.bsb||"—"}/>
              <RowItem label="Account" value={vendor.account_number?`••••${vendor.account_number.slice(-4)}`:"—"}/>

                <div><p style={{color:S.text,fontSize:13,fontWeight:600}}>{p.period}</p><p style={{color:S.muted,fontSize:11}}>{p.items} items · {p.reference} · {fmtD(p.payment_date)}</p></div>
                <div style={{textAlign:"right"}}><p style={{color:S.green,fontWeight:700,fontSize:16,fontFamily:"monospace"}}>{fmt(p.amount)}</p><Tag color={S.green}>{p.status}</Tag></div>
              </div>

          </div>

        {view==="myplan"&&(

              <p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>My Plan</p>
              <Btn small onClick={()=>setPlanModal(true)}>Change Plan</Btn>

              <Tag color={p.col}>Current Plan</Tag>
              <p style={{color:S.text,fontWeight:900,fontSize:26,fontFamily:"monospace",marginTop:8}}>{p.name}</p>
              <p style={{color:p.col,fontSize:14,fontWeight:700,marginBottom:14}}>${p.payout} per item · ${p.price}/month</p>

            </div>
            <p style={{color:S.muted,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em"}}>Other Plans</p>
            {PLANS.filter(pl=>pl.id!==p.id).map(pl=>(
              <div key={pl.id} style={{border:`1px solid ${S.border}`,borderRadius:14,padding:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}><p style={{fontWeight:700,color:S.text,fontSize:15}}>{pl.name}</p>{pl.badge&&<Tag color={pl.col}>{pl.badge}</Tag>}</div><p style={{color:pl.col,fontSize:12,fontWeight:600}}>${pl.payout}/item · ${pl.price}/mo</p></div>
                <Btn small outline color={pl.col} onClick={()=>setPlanModal(true)}>Switch ↗</Btn>
              </div>
            ))}
          </div>
        )}

        {view==="settings"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <p style={{color:S.text,fontWeight:900,fontSize:20,fontFamily:"monospace"}}>Settings</p>
              {!editing&&<button onClick={()=>{setEditForm({phone:vendor.phone,bank:vendor.bank,bsb:vendor.bsb,accountNumber:vendor.account_number,accountName:vendor.account_name});setEditing(true);}} style={{background:S.accent,border:"none",borderRadius:8,padding:"7px 14px",color:"#000",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✏ Edit Details</button>}
            </div>

            {/* Profile - read only */}
            <Card>
              <p style={{fontWeight:700,color:S.text,marginBottom:10}}>Profile</p>
              <RowItem label="Brand" value={vendor.brand_name}/>
              <RowItem label="Name" value={vendor.name}/>
              <RowItem label="Email" value={vendor.email}/>
              {!editing&&<RowItem label="Phone" value={vendor.phone||"—"}/>}
              {editing&&<div style={{marginTop:8}}><p style={{color:S.muted,fontSize:11,marginBottom:4}}>PHONE</p><input value={editForm.phone||""} onChange={e=>setEditForm(f=>({...f,phone:e.target.value}))} placeholder="+61 4XX XXX XXX" style={{width:"100%",background:S.input,border:`1px solid ${S.border}`,borderRadius:8,padding:"8px 12px",color:S.text,fontFamily:"inherit",fontSize:13}}/></div>}
            </Card>

            {/* Banking */}
            <Card>
              <p style={{fontWeight:700,color:S.text,marginBottom:10}}>Banking Details</p>
              {!editing&&(
                <>
                  <RowItem label="Bank" value={vendor.bank||"Not set"}/>
                  <RowItem label="Account Name" value={vendor.account_name||"Not set"}/>
                  <RowItem label="BSB" value={vendor.bsb||"Not set"}/>
                  <RowItem label="Account No." value={vendor.account_number?`••••${vendor.account_number.slice(-4)}`:"Not set"}/>
                </>
              )}
              {editing&&(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {[["bank","Bank Name","e.g. Commonwealth Bank"],["accountName","Account Name","Must match exactly"],["bsb","BSB","062-000"],["accountNumber","Account Number","12345678"]].map(([k,label,ph])=>(
                    <div key={k}>
                      <p style={{color:S.muted,fontSize:11,marginBottom:4}}>{label.toUpperCase()}</p>
                      <input value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:S.input,border:`1px solid ${S.border}`,borderRadius:8,padding:"8px 12px",color:S.text,fontFamily:"inherit",fontSize:13}}/>
                    </div>
                  ))}
                </div>
              )}
            </Card>

            {/* Address */}
            <Card>
              <p style={{fontWeight:700,color:S.text,marginBottom:10}}>Business Address</p>
              {!editing&&<RowItem label="Address" value={vendor.address||"Not set"}/>}
              {editing&&(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {[["street","Street","123 Main Street"],["suburb","Suburb","Melbourne"],["state","State","VIC"],["postcode","Postcode","3000"]].map(([k,label,ph])=>(
                    <div key={k}>
                      <p style={{color:S.muted,fontSize:11,marginBottom:4}}>{label.toUpperCase()}</p>
                      <input value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:S.input,border:`1px solid ${S.border}`,borderRadius:8,padding:"8px 12px",color:S.text,fontFamily:"inherit",fontSize:13}}/>
                    </div>
                  ))}
                </div>
              )}
            </Card>

            {editing&&(
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setEditing(false)} style={{flex:1,padding:"11px",background:"none",border:`1px solid ${S.border}`,borderRadius:10,color:S.muted,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
                <button onClick={saveProfile} disabled={saving} style={{flex:2,padding:"11px",background:S.green,border:"none",borderRadius:10,color:"#000",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{saving?"Saving…":"Save Changes"}</button>
              </div>
            )}
          </div>
        )}

      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(10,10,15,0.97)",borderTop:`1px solid ${S.border}`,padding:"9px 6px 12px"}}>
        <div style={{display:"flex",justifyContent:"space-around"}}>
          {NAV.map(([id,label,icon])=><button key={id} onClick={()=>setView(id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 10px",background:"none",border:"none",cursor:"pointer",opacity:view===id?1:0.35,fontFamily:"inherit"}}><span style={{fontSize:16,color:view===id?S.accent:S.text}}>{icon}</span><span style={{fontSize:9,fontWeight:700,color:view===id?S.accent:S.muted}}>{label}</span></button>)}
        </div>
      </div>

      {planModal&&<PlanModal vendor={vendor} onSave={savePlan} onClose={()=>setPlanModal(false)}/>}
      {stripeModal&&<StripePaymentModal vendor={vendor} planId={stripeModal} onSuccess={onSubscribeSuccess} onClose={()=>setStripeModal(null)}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// ADMIN PORTAL
// ══════════════════════════════════════════════════════════════════════════════
function AdminPortal({onLogout}){
  const[view,setView]=useState("dashboard");
  const[vendors,setVendors]=useState([]);
  const[orders,setOrders]=useState([]);
  const[payments,setPayments]=useState([]);
  const[detail,setDetail]=useState(null);
  const[planModal,setPlanModal]=useState(null);
  const[loading,setLoading]=useState(true);
  const[toast,setToast]=useState(null);
  const[publishing,setPublishing]=useState(null);
  const[vendorProducts,setVendorProducts]=useState([]);
  const[catalogue,setCatalogue]=useState([]);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),3000);};

  const load=useCallback(async()=>{
    setLoading(true);
    const[{data:v},{data:o},{data:p},{data:vp},cat]=await Promise.all([
      sb.from("vendors").select("*").order("created_at",{ascending:false}),
      sb.from("orders").select("*").order("order_date",{ascending:false}),
      sb.from("payments").select("*").order("created_at",{ascending:false}),
      sb.from("vendor_products").select("*"),
      fetchProducts().catch(()=>[]),
    ]);
    setVendors(v||[]);setOrders(o||[]);setPayments(p||[]);setVendorProducts(vp||[]);setCatalogue(cat);
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  const savePlan=async(vid,planId)=>{
    const p=planOf(planId);
    await sb.from("vendors").update({plan:planId,payout_rate:p.payout}).eq("id",vid);
    await sb.from("subscriptions").upsert({vendor_id:vid,plan:planId,price:p.price,payout_rate:p.payout,status:"active"},{onConflict:"vendor_id"});
    setVendors(vs=>vs.map(v=>v.id===vid?{...v,plan:planId,payout_rate:p.payout}:v));
    showToast(`Plan updated to ${p.name}`);
  };

  const setStatus=async(vid,status)=>{
    const vendor=vendors.find(v=>v.id===vid);
    const update={status};
    // Auto-populate collection_name from brand_name on activation
    if(status==="active"&&vendor&&vendor.brand_name){
      update.collection_name=vendor.brand_name;
    }
    await sb.from("vendors").update(update).eq("id",vid);
    setVendors(vs=>vs.map(v=>v.id===vid?{...v,...update}:v));
    showToast(`Vendor ${status}`);
  };

  // Approves a vendor and pushes their chosen products live to Shopify:
  // generates a composited mockup per logo, uploads it, then has the proxy
  // (privileged Admin API access) create the actual products/variants and
  // add them to the vendor's collection.
  // onlyProduct: pass a specific vendor_products row to publish just that
  // one (per-row "Publish" button); omit to publish everything unpublished
  // for the vendor at once.
  const approveAndPublish=async(vendor,onlyProduct)=>{
    const brandName=vendor.brand_name||vendor.store_name||vendor.name||"this vendor";
    let toPublish;
    if(onlyProduct){
      if(onlyProduct.shopify_product_id){showToast("Already published");return;}
      toPublish=[onlyProduct];
    }else{
      const{data:vp}=await sb.from("vendor_products").select("*").eq("vendor_id",vendor.id);
      const products=(vp||[]).filter(p=>p.product_id);
      if(!products.length){showToast("No products to publish for "+brandName);return;}
      toPublish=products.filter(p=>!p.shopify_product_id);
      if(!toPublish.length){showToast("All products already published for "+brandName);return;}
    }
    const label=onlyProduct?"this product":`${toPublish.length} product(s)`;
    if(!confirm(`This will create ${label} live on Shopify for ${brandName}, published immediately on the storefront. Continue?`))return;

    const publishKey=onlyProduct?onlyProduct.id:vendor.id;
    setPublishing(publishKey);
    try{
      if(vendor.status!=="active")await setStatus(vendor.id,"active");

      const catalogue=await fetchProducts().catch(()=>[]);
      for(const p of toPublish){
        const prod=catalogue.find(c=>c.id===p.product_id);
        if(!prod)continue;
        const patch={};
        try{
          if(p.colours && p.colours.length){
            // One mockup per colour, composited on that colour's own photo,
            // so the storefront shows the design on the actual selected colour
            // instead of a single generic shot reused for every variant.
            if(!p.colour_mockups){
              const colourMockups={};
              for(const colour of p.colours){
                const imgs=prod.colourImages?.[colour]||{};
                const entry={};
                if(p.front_logo_url)entry.front=await generateMockup(imgs.front||prod.frontImage,p.front_logo_url,p.front_placement);
                if(p.back_logo_url)entry.back=await generateMockup(imgs.back||prod.backImage,p.back_logo_url,p.back_placement);
                colourMockups[colour]=entry;
              }
              patch.colour_mockups=colourMockups;
              const first=colourMockups[p.colours[0]];
              if(first?.front)patch.front_mockup_url=first.front;
              if(first?.back)patch.back_mockup_url=first.back;
            }
          }else{
            if(p.front_logo_url && !p.front_mockup_url)
              patch.front_mockup_url=await generateMockup(prod.frontImage,p.front_logo_url,p.front_placement);
            if(p.back_logo_url && !p.back_mockup_url)
              patch.back_mockup_url=await generateMockup(prod.backImage,p.back_logo_url,p.back_placement);
          }
          if(Object.keys(patch).length){
            const{error}=await sb.from("vendor_products").update(patch).eq("id",p.id);
            if(error)throw new Error("Saving mockup(s) failed: "+error.message);
          }
        }catch(e){
          showToast(`Mockup generation failed for ${prod.name}: ${e.message}`);
        }
      }

      const res=await fetch(PROXY+"/shopify/publish-vendor",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(onlyProduct?{vendorId:vendor.id,productRowId:onlyProduct.id}:{vendorId:vendor.id}),
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Publish failed");
      const ok=(data.results||[]).filter(r=>r.status==="published").length;
      const failed=(data.results||[]).filter(r=>r.status==="error");
      if(failed.length){
        showToast(`${brandName}: ${failed[0].error||"publish failed"}`);
        console.error("Publish errors:",failed);
      }else{
        showToast(`${brandName}: ${ok} product(s) published`);
      }
      await load();
    }catch(e){
      showToast("Publish failed: "+e.message);
    }finally{
      setPublishing(null);
    }
  };

  const now=new Date();
  const period=now.toLocaleString("en-AU",{month:"long",year:"numeric"});
  const activeVendors=vendors.filter(v=>v.status==="active");
  const totalRev=orders.reduce((s,o)=>s+(o.revenue||0),0);
  const totalPayout=vendors.reduce((s,v)=>s+orders.filter(o=>o.vendor_id===v.id&&o.period===period).reduce((s2,o)=>s2+(o.quantity||0),0)*(v.payout_rate||10),0);
  const totalMRR=activeVendors.reduce((s,v)=>s+planOf(v.plan).price,0);

  const vd=detail?vendors.find(v=>v.id===detail):null;

  const NAV=[["dashboard","Dashboard","◈"],["vendors","Vendors","⬡"],["payments","Payments","◆"],["orders","Orders","◎"],["plans","Plans","★"],["printzones","Print Zones","▦"],["printfiles","Print Files","⬇"]];

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:S.bg}}><Spin/></div>;

  return(
    <div style={{background:S.bg,minHeight:"100vh"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:S.green,color:"#000",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:300}}>✓ {toast}</div>}

      <div style={{background:"rgba(10,10,15,0.97)",borderBottom:`1px solid ${S.border}`,padding:"13px 22px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:S.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⬡</div>
          <div><p style={{fontFamily:"monospace",fontWeight:900,fontSize:14,color:S.text}}>MERCH ON DEMAND</p><p style={{color:S.muted,fontSize:10}}>Admin Portal</p></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:S.green,boxShadow:`0 0 6px ${S.green}`}}/>
          <span style={{color:S.muted,fontSize:10}}>Live · Supabase</span>
          <button onClick={load} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${S.border}`,borderRadius:8,padding:"5px 10px",color:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>↻ Refresh</button>
          <button onClick={onLogout} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${S.border}`,borderRadius:8,padding:"5px 10px",color:S.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Sign out</button>
        </div>
      </div>

      <div style={{background:"rgba(10,10,15,0.97)",borderBottom:`1px solid ${S.border}`,display:"flex",overflowX:"auto",padding:"0 18px"}}>
        {NAV.map(([id,label,icon])=><button key={id} onClick={()=>{setView(id);setDetail(null);}} style={{padding:"11px 16px",background:"none",border:"none",borderBottom:`2px solid ${view===id?S.green:"transparent"}`,color:view===id?S.green:S.muted,fontWeight:view===id?700:500,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{icon} {label}</button>)}
      </div>

      <div style={{padding:"22px",maxWidth:960,margin:"0 auto"}}>

        {view==="dashboard"&&(
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            <div><p style={{fontFamily:"monospace",fontSize:22,fontWeight:900,color:S.text}}>Overview</p><p style={{color:S.muted,fontSize:12,marginTop:3}}>{period} · All vendors</p></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Stat label="Total Revenue" value={fmt(totalRev)} sub={`${orders.length} orders`} color={S.green}/>
              <Stat label="Vendor Payouts" value={fmt(totalPayout)} sub="Pending this month" color={S.amber}/>
              <Stat label="Subscription MRR" value={fmt(totalMRR)} sub={`${activeVendors.length} active`} color="#A78BFA"/>
              <Stat label="Total Vendors" value={vendors.length} sub={`${activeVendors.length} active`}/>
            </div>
            <Card>
              <p style={{fontWeight:700,color:S.text,marginBottom:14,fontFamily:"monospace"}}>Plan Distribution</p>
              {PLANS.map(pl=>{const count=vendors.filter(v=>v.plan===pl.id&&v.status==="active").length;const pct=activeVendors.length>0?(count/activeVendors.length)*100:0;return(
                <div key={pl.id} style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{color:S.text,fontSize:13,fontWeight:600}}>{pl.name}</span><span style={{color:pl.col,fontSize:13,fontWeight:700}}>{count} vendor{count!==1?"s":""} · ${pl.price}/mo</span></div>
                  <div style={{height:6,background:S.faint,borderRadius:99,overflow:"hidden"}}><div style={{height:6,width:`${pct}%`,background:pl.col,borderRadius:99}}/></div>
                </div>
              );})}
            </Card>
            <Card>
              <p style={{fontWeight:700,color:S.text,marginBottom:14,fontFamily:"monospace"}}>Recent Orders</p>
              {orders.slice(0,6).map(o=>{const v=vendors.find(x=>x.id===o.vendor_id);return(
                <div key={o.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${S.border}`}}>
                  <div><p style={{color:S.text,fontSize:13}}>{o.product_title}</p><p style={{color:S.muted,fontSize:11}}>{v?.brand_name||v?.store_name||"Unknown"} · {fmtD(o.order_date)}</p></div>
                  <div style={{textAlign:"right"}}><p style={{color:S.green,fontWeight:700}}>{fmt(o.revenue)}</p><p style={{color:S.muted,fontSize:10}}>qty {o.quantity}</p></div>
                </div>
              );})}
              {orders.length===0&&<p style={{color:S.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>No orders yet — sync Shopify to populate</p>}
            </Card>
          </div>
        )}

        {view==="vendors"&&!vd&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><p style={{fontFamily:"monospace",fontSize:22,fontWeight:900,color:S.text}}>Vendors</p><span style={{color:S.muted,fontSize:13}}>{vendors.length} total</span></div>
            {vendors.length===0&&<p style={{color:S.muted,textAlign:"center",padding:"40px 0"}}>No vendors yet — they'll appear here once they complete onboarding</p>}
            {vendors.map(v=>{const pl=planOf(v.plan);const vOrders=orders.filter(o=>o.vendor_id===v.id&&o.period===period);const payout=vOrders.reduce((s,o)=>s+(o.quantity||0),0)*(v.payout_rate||10);return(
              <div key={v.id} style={{background:S.card,border:`1px solid ${S.border}`,borderRadius:14,padding:18,cursor:"pointer"}} onClick={()=>setDetail(v.id)}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div style={{display:"flex",gap:12,alignItems:"center"}}>
                    <div style={{width:38,height:38,borderRadius:10,background:pl.col+"22",border:`1.5px solid ${pl.col}44`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:15,color:pl.col}}>{(v.brand_name||v.store_name||"V")[0]}</div>
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}><p style={{color:S.text,fontWeight:700,fontSize:14}}>{v.brand_name||v.store_name}</p><Tag color={v.status==="active"?S.green:v.status==="pending"?S.amber:S.muted}>{v.status}</Tag></div>
                      <p style={{color:S.muted,fontSize:12}}>{v.name} · {v.email}</p>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}><Tag color={pl.col}>{pl.name}</Tag><p style={{color:S.green,fontWeight:700,fontSize:16,marginTop:4,fontFamily:"monospace"}}>{fmt(payout)}</p><p style={{color:S.muted,fontSize:10}}>payout due</p></div>
                </div>
                <div style={{display:"flex",gap:16,fontSize:11,color:S.muted}}>
                  <span>{vOrders.reduce((s,o)=>s+(o.quantity||0),0)} items this month</span>
                  <span>Joined: {fmtD(v.created_at)}</span>
                </div>
              </div>
            );})}
          </div>
        )}

        {view==="vendors"&&vd&&(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <Btn small outline onClick={()=>setDetail(null)}>← Back</Btn>
              <div><p style={{fontFamily:"monospace",fontSize:18,fontWeight:900,color:S.text}}>{vd.brand_name||vd.store_name}</p><p style={{color:S.muted,fontSize:12}}>{vd.name} · {vd.email}</p></div>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <Btn small color={S.green} onClick={()=>setPlanModal(vd.id)}>Change Plan</Btn>
              {vd.status==="active"?<Btn small outline color={S.amber} onClick={()=>setStatus(vd.id,"paused")}>Pause</Btn>:<Btn small outline color={S.green} onClick={()=>setStatus(vd.id,"active")}>Activate</Btn>}
              <Btn small outline color={S.red} onClick={()=>setStatus(vd.id,"removed")}>Remove</Btn>
              <Btn small outline color={"#00AEEF"} disabled={publishing===vd.id} onClick={()=>approveAndPublish(vd)}>{publishing===vd.id?<Spin/>:"🛍 Approve & Publish to Shopify"}</Btn>
            </div>
            {/* Design summary */}
            {(()=>{
              const rows=vendorProducts.filter(p=>p.vendor_id===vd.id);
              if(!rows.length)return(<div style={{background:S.bg,borderRadius:12,padding:14,marginBottom:14}}><p style={{color:S.muted,fontSize:12}}>No products set up yet.</p></div>);
              return(<div style={{background:S.bg,borderRadius:12,padding:14,marginBottom:14}}>
                <p style={{fontWeight:700,color:S.text,marginBottom:10,fontSize:13}}>Design Selections</p>
                {rows.map((s)=>{
                  const prod=catalogue.find(c=>c.id===s.product_id);
                  const thumb=s.front_mockup_url||Object.values(s.colour_mockups||{})[0]?.front||prod?.frontImage;
                  return(
                  <div key={s.id} style={{display:"flex",gap:10,background:S.card,borderRadius:8,padding:10,marginBottom:8}}>
                    {thumb?<img src={thumb} style={{width:52,height:52,objectFit:"cover",borderRadius:6,background:"#000",flexShrink:0}}/>:<div style={{width:52,height:52,borderRadius:6,background:S.faint,flexShrink:0}}/>}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:8}}>
                        <p style={{color:S.text,fontWeight:600,fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prod?.name||s.product_id}</p>
                        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                          {s.shopify_product_id?<Tag color={S.green}>Published</Tag>:<Tag color={S.muted}>Not published</Tag>}
                          {!s.shopify_product_id&&(
                            <Btn small outline color={"#00AEEF"} disabled={publishing===s.id} onClick={()=>approveAndPublish(vd,s)}>{publishing===s.id?<Spin/>:"Publish"}</Btn>
                          )}
                        </div>
                      </div>
                      {s.colours&&s.colours.length>0&&<p style={{color:S.muted,fontSize:11,marginBottom:2}}>Colours: {s.colours.join(", ")}</p>}
                      {s.sizes&&s.sizes.length>0&&<p style={{color:S.muted,fontSize:11,marginBottom:2}}>Sizes: {s.sizes.join(", ")}</p>}
                      {s.front_logo_url&&<p style={{color:S.muted,fontSize:11,marginBottom:2}}>Front logo: <a href={s.front_logo_url} target="_blank" style={{color:S.accent}}>view</a></p>}
                      {s.back_logo_url&&<p style={{color:S.muted,fontSize:11,marginBottom:2}}>Back logo: <a href={s.back_logo_url} target="_blank" style={{color:S.accent}}>view</a></p>}
                    </div>
                  </div>
                  );
                })}
              </div>);
            })()}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {(()=>{const vOrders=orders.filter(o=>o.vendor_id===vd.id&&o.period===period);const qty=vOrders.reduce((s,o)=>s+(o.quantity||0),0);return(<>

const DEFAULT_PRINT_ZONE = {x:40, y:30, w:120, h:150};

function ZoneCanvas({image, zone, onChange}) {
  const svgRef = React.useRef();
  const drag = React.useRef(null);
  const resize = React.useRef(null);

  const getScale = () => {
    if (!svgRef.current) return {sx:1,sy:1};
    const r = svgRef.current.getBoundingClientRect();
    return {sx:r.width/200, sy:r.height/220};
  };
  const clientXY = e => e.touches ? [e.touches[0].clientX, e.touches[0].clientY] : [e.clientX, e.clientY];

  const startDrag = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx,sy} = getScale();
    const [cx,cy] = clientXY(e);
    drag.current = {mx:cx, my:cy, lx:zone.x*sx, ly:zone.y*sy};
    const move = ev => {
      if (!drag.current) return;
      const [ex,ey] = clientXY(ev);
      const {sx:sx2,sy:sy2} = getScale();
      let nx = (drag.current.lx + (ex-drag.current.mx)) / sx2;
      let ny = (drag.current.ly + (ey-drag.current.my)) / sy2;
      nx = Math.max(0, Math.min(200-zone.w, nx));
      ny = Math.max(0, Math.min(220-zone.h, ny));
      onChange({...zone, x:Math.round(nx), y:Math.round(ny)});
    };
    const up = () => { drag.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  const startResize = e => {
    e.preventDefault(); e.stopPropagation();
    const {sx,sy} = getScale();
    const [cx,cy] = clientXY(e);
    resize.current = {mx:cx, my:cy, lw:zone.w*sx, lh:zone.h*sy};
    const move = ev => {
      if (!resize.current) return;
      const [ex,ey] = clientXY(ev);
      const {sx:sx2,sy:sy2} = getScale();
      let nw = (resize.current.lw + (ex-resize.current.mx)) / sx2;
      let nh = (resize.current.lh + (ey-resize.current.my)) / sy2;
      nw = Math.max(10, Math.min(200-zone.x, nw));
      nh = Math.max(10, Math.min(220-zone.y, nh));
      onChange({...zone, w:Math.round(nw), h:Math.round(nh)});
    };
    const up = () => { resize.current=null; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };

  return (
    <svg ref={svgRef} viewBox="0 0 200 220" style={{width:"100%",maxWidth:320,display:"block",background:"#1A1A1A",borderRadius:8}}>
      {image ? (
        <image href={image} x="10" y="10" width="180" height="200" preserveAspectRatio="xMidYMid meet"/>
      ) : (
        <text x="100" y="110" textAnchor="middle" fontSize="10" fill="#71717a">No product photo</text>
      )}
      <rect x={zone.x} y={zone.y} width={zone.w} height={zone.h} fill="rgba(139,92,246,0.12)" stroke={S.accent} strokeWidth="1.5" strokeDasharray="5,3" rx="2" style={{cursor:"move"}} onMouseDown={startDrag} onTouchStart={startDrag}/>
      <rect x={zone.x+zone.w-10} y={zone.y+zone.h-10} width="12" height="12" fill={S.accent} rx="2" style={{cursor:"se-resize"}} onMouseDown={startResize} onTouchStart={startResize}/>
    </svg>
  );
}

function PrintZoneEditor(){
  const [products, setProducts] = useState([]);
  const [zones, setZones] = useState({}); // `${productId}:${side}` -> {x,y,w,h}
  const [loading, setLoading] = useState(true);
  const [selectedId, setSelectedId] = useState(null);
  const [side, setSide] = useState("front");
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null),2500); };

  const load = useCallback(async () => {
    setLoading(true);
    const [prodJson, zoneRes] = await Promise.all([
      fetch(PROXY + "/shopify/products").then(r=>r.json()),
      sb.from("print_zones").select("*"),
    ]);
    const prods = (prodJson.data?.products?.edges || []).map(({node:p}) => ({
      id: p.id, name: p.title,
      frontImage: p.images.edges[0]?.node?.url || null,
      backImage:  p.images.edges[1]?.node?.url || p.images.edges[0]?.node?.url || null,
    }));
    setProducts(prods);
    const zmap = {};
    (zoneRes.data || []).forEach(z => { zmap[`${z.product_id}:${z.side}`] = {x:z.x, y:z.y, w:z.w, h:z.h}; });
    setZones(zmap);
    setSelectedId(cur => cur || prods[0]?.id || null);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const product = products.find(p => p.id === selectedId);
  const key = selectedId ? `${selectedId}:${side}` : null;
  const zone = key ? (zones[key] || DEFAULT_PRINT_ZONE) : DEFAULT_PRINT_ZONE;
  const isCustom = !!(key && zones[key]);

  const setZone = patch => {
    if (!key) return;
    setZones(z => ({...z, [key]: {...zone, ...patch}}));
  };

  const save = async () => {
    if (!key) return;
    setSaving(true);
    const { error } = await sb.from("print_zones").upsert({
      product_id: selectedId, side, x:zone.x, y:zone.y, w:zone.w, h:zone.h,
    }, {onConflict:"product_id,side"});
    setSaving(false);
    showToast(error ? "Save failed: " + error.message : "Print zone saved");
  };

  const resetZone = async () => {
    if (!key) return;
    if (zones[key]) {
      setSaving(true);
      await sb.from("print_zones").delete().eq("product_id", selectedId).eq("side", side);
      setSaving(false);
    }
    setZones(z => { const n = {...z}; delete n[key]; return n; });
    showToast("Reset to default zone");
  };

  if (loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:60}}><Spin/></div>;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {toast && <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:S.green,color:"#000",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:300}}>✓ {toast}</div>}
      <div>
        <p style={{fontFamily:"monospace",fontSize:22,fontWeight:900,color:S.text}}>Print Zones</p>
        <p style={{color:S.muted,fontSize:12,marginTop:3}}>Drag and resize the box to set where logos can be placed on each product/side. Vendors see this exact zone during onboarding.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16}}>
        <Card style={{maxHeight:560,overflowY:"auto",padding:10}}>
          {products.map(p => (
            <button key={p.id} onClick={()=>setSelectedId(p.id)}
              style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"8px 8px",background:selectedId===p.id?S.faint:"transparent",border:"none",borderRadius:8,cursor:"pointer",fontFamily:"inherit",textAlign:"left",marginBottom:2}}>
              {p.frontImage ? <img src={p.frontImage} style={{width:28,height:28,objectFit:"cover",borderRadius:4,background:"#000"}}/> : <div style={{width:28,height:28,borderRadius:4,background:S.faint}}/>}
              <span style={{color:selectedId===p.id?S.text:S.muted,fontSize:12,fontWeight:selectedId===p.id?700:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
              {(zones[`${p.id}:front`]||zones[`${p.id}:back`]) && <span style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:S.green,flexShrink:0}}/>}
            </button>
          ))}
        </Card>

        <Card>
          {!product ? <p style={{color:S.muted,fontSize:13}}>No products loaded.</p> : (
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <p style={{color:S.text,fontWeight:700,fontSize:14}}>{product.name}</p>
                <div style={{display:"flex",background:"rgba(255,255,255,0.03)",border:`1px solid ${S.border}`,borderRadius:10,padding:3}}>
                  {["front","back"].map(s => (
                    <button key={s} onClick={()=>setSide(s)} style={{padding:"6px 14px",border:"none",borderRadius:7,background:side===s?S.accent:"transparent",color:side===s?"#fff":S.muted,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"inherit",textTransform:"uppercase"}}>{s}</button>
                  ))}
                </div>
              </div>

              <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                <div style={{flex:"0 0 auto",width:280}}>
                  <ZoneCanvas image={side==="front"?product.frontImage:product.backImage} zone={zone} onChange={setZone}/>
                  {isCustom ? <Tag color={S.green}>Custom zone saved</Tag> : <Tag color={S.muted}>Using default zone</Tag>}
                </div>

                <div style={{flex:"1 1 200px",minWidth:200}}>
                  {[["x","X"],["y","Y"],["w","Width"],["h","Height"]].map(([k,label])=>(
                    <div key={k} style={{marginBottom:12}}>
                      <label style={{display:"block",fontSize:10,fontWeight:700,color:S.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{label}</label>
                      <input type="number" value={Math.round(zone[k])} onChange={e=>setZone({[k]:Number(e.target.value)||0})}
                        style={{width:"100%",padding:"8px 10px",background:"rgba(255,255,255,0.05)",border:`1px solid ${S.border}`,borderRadius:8,color:S.text,fontSize:13,fontFamily:"monospace",outline:"none",boxSizing:"border-box"}}/>
                    </div>
                  ))}
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <Btn onClick={save} disabled={saving} color={S.green}>{saving?<Spin/>:"Save Zone"}</Btn>
                    <Btn onClick={resetZone} disabled={saving} outline color={S.muted}>Reset</Btn>
                  </div>
                </div>
              </div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

// ── Stripe subscription creator ──────────────────────────────────────────────
async function createStripeSubscription(email, name, planId, cardElement) {
  const stripe = Stripe(STRIPE_PK);
  const priceId = PRICE_IDS[planId];
  if (!priceId) throw new Error("Invalid plan");

  const { paymentMethod, error } = await stripe.createPaymentMethod({
    type: "card", card: cardElement,
    billing_details: { email, name },
  });
  if (error) throw new Error(error.message);

  const res = await fetch(PROXY + "/stripe/subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, name, priceId, paymentMethodId: paymentMethod.id }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Subscription failed");

  if (data.clientSecret) {
    const { error: ce } = await stripe.confirmCardPayment(data.clientSecret);
    if (ce) throw new Error(ce.message);
  }
  return data;
}

        <Card style={{marginBottom:14}}>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:10,fontWeight:700,color:S.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Email</label>
            <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" type="email" style={iS} onFocus={e=>e.target.style.borderColor=S.green} onBlur={e=>e.target.style.borderColor=S.border}/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:10,fontWeight:700,color:S.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Password</label>
            <input value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" type="password" style={iS} onFocus={e=>e.target.style.borderColor=S.green} onBlur={e=>e.target.style.borderColor=S.border} onKeyDown={e=>e.key==="Enter"&&handle()}/>
          </div>
          {err&&<p style={{color:S.red,fontSize:12,marginBottom:12}}>⚠ {err}</p>}
          <Btn onClick={handle} disabled={loading||!email||!pass} full color={S.green}>
            {loading?<Spin/>:"Sign In →"}
          </Btn>
        </Card>
      </div>
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[checking,setChecking]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{setSession(data.session);setChecking(false);});
    const{data:listener}=sb.auth.onAuthStateChange((_event,newSession)=>{setSession(newSession);});
    return ()=>listener.subscription.unsubscribe();
  },[]);

  const logout=async()=>{await sb.auth.signOut();setSession(null);};

  if(checking)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:S.bg}}><Spin/></div>;
  if(!session)return <Login onLogin={s=>setSession(s)}/>;
  // role is read from app_metadata, which only Supabase (via the dashboard/admin API) can set —
  // it cannot be edited by the signed-in user, unlike user_metadata.
  const isAdmin=session.user?.app_metadata?.role==="admin";
  if(isAdmin)return <AdminPortal onLogout={logout}/>;
  return <VendorPortal session={session} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
